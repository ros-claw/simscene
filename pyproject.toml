[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rosclaw-simscene"
version = "0.1.0.dev0"
requires-python = ">=3.10"
description = "Agent-oriented simulation scene tools"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["mcp>=1.0,<2", "PyYAML>=6,<7"]

[project.urls]
Repository = "https://github.com/ros-claw/rosclaw-simscene"
Issues = "https://github.com/ros-claw/rosclaw-simscene/issues"

[project.optional-dependencies]
ik = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
simscene = "simscene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
