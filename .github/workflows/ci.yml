name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[ik]' usd-core
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test*.py'
      - name: MCP concurrency regression
        run: python -m unittest discover -s tests/agent -p 'test_mcp_concurrency.py'
      - name: Checker regressions
        run: |
          python -m unittest discover -s tests/agent -p 'test_online_checker_snapshot.py'
          python -m unittest discover -s tests/agent -p 'test_route_asset_snapshot.py'
          python -m unittest discover -s tests/agent -p 'test_retime_repair_bounds.py'

