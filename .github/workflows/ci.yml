name: CPU checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install video backend
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install
        run: python -m pip install -e '.[ik,build]' usd-core 'pytest>=9,<10'
      - name: Unit tests
        run: python -m pytest tests --ignore=tests/agent -q
      - name: Agent contracts, transports, packaging and checker regressions
        run: python -m unittest discover -s tests/agent -p 'test*.py'
      - name: Offline source registry
        run: simscene catalog validate
